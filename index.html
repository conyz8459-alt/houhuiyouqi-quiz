    if(Math.abs(ranking[0].distance-ranking[1].distance)<1e-10){const strongest=values.map((v,i)=>({i,weight:Math.abs(v-.5)})).sort((a,b)=>b.weight-a.weight);ranking.sort((a,b)=>{if(Math.abs(a.distance-b.distance)>1e-10)return a.distance-b.distance;for(const item of strongest){const delta=Math.abs(values[item.i]-a.person.target[item.i])-Math.abs(values[item.i]-b.person.target[item.i]);if(Math.abs(delta)>1e-10)return delta;}return a.person.id.localeCompare(b.person.id);});}
    const winner=ranking[0].person;
    const reasons=answers.map((answer,index)=>{const option=QUESTIONS[index].options[answer];let fit=0,coverage=0;option.s.forEach((v,axis)=>{if(v!==null){fit+=1-Math.abs((v+2)/4-winner.target[axis]);coverage++;}});return{index,text:option.why,fit:fit/coverage};}).sort((a,b)=>b.fit-a.fit).slice(0,3).sort((a,b)=>a.index-b.index);
    return{person:winner,values,ranking,reasons,secondary:ranking[1].distance-ranking[0].distance<.025?ranking[1].person:null};
  }

  function pairAdvice(me,friend){
    if(me.id===friend.id){const [bond,gap,plan]=SAME_PAIR[me.id];return pairSections(bond,gap,plan,me,friend);}
    const differences=me.target.map((value,index)=>({index,gap:Math.abs(value-friend.target[index])})).sort((a,b)=>b.gap-a.gap);
    const axis=differences[0].index;
    const common=differences.filter(({index:i})=>(me.target[i]<=.4&&friend.target[i]<=.4)||(me.target[i]>=.65&&friend.target[i]>=.65));
    const shared=(common.length?common[common.length-1]:differences[differences.length-1]).index;
    const hi=me.target[axis]>=friend.target[axis]?'你':'你的朋友',lo=hi==='你'?'你的朋友':'你';
    const sharedSide=me.target[shared]<=.4&&friend.target[shared]<=.4?0:me.target[shared]>=.65&&friend.target[shared]>=.65?1:2;
    const bond=PAIR_RULES[shared].bond[sharedSide];
    const gap=(differences[0].gap<.3?'你们的习惯其实挺接近。只是有些时候，':'')+PAIR_RULES[axis].gap(hi,lo);
    return pairSections(bond,gap,PAIR_RULES[axis].plan,me,friend,sharedSide===2?'可以从这里靠近':'你们可能合拍的地方');
  }
  function pairSections(bond,gap,plan,me,friend,bondTitle='你们可能合拍的地方'){return{sections:[
    {title:bondTitle,text:bond},
    {title:'有时会拧巴在这里',text:gap},
    {title:'你可以试着这样做',text:FRIEND_TIPS[friend.id]},
    {title:'你也可以对 TA 说',text:FRIEND_REQUESTS[me.id]},
    {title:'下次相处，试一件小事',text:plan}
  ]};}

    if(!friend){container.innerHTML='';return;}
    const me=currentResult.person,pair=pairAdvice(me,friend);
    container.innerHTML=`<div class="pair-people"><div><img src="${PHOTOS[me.id]}" alt="${me.name}嘉宾海报" loading="lazy" decoding="async"><span>你 · ${me.name}型</span></div><span class="pair-and" aria-hidden="true">＆</span><div><img src="${PHOTOS[friend.id]}" alt="${friend.name}嘉宾海报" loading="lazy" decoding="async"><span>朋友 · ${friend.name}型</span></div></div>${pair.sections.map(section=>`<section class="pair-note"><h3>${section.title}</h3><p>${section.text}</p></section>`).join('')}<p class="reading-note">把这些话当成聊天的开头就好，你们怎么相处，还是你们最清楚。复制结果文案时，也会带上这份双人小建议。</p>`;
  }

  let resultLoadToken=0,resultLoadTimers=[];
  function cancelResultLoad(){resultLoadToken++;resultLoadTimers.forEach(clearTimeout);resultLoadTimers=[];}
  function renderResult(){
    cancelAdvance();cancelResultLoad();currentResult=scoreAnswers(state.answers);currentScreen='result-loading';
    const token=resultLoadToken;let finished=false;const photo=new Image();
    const finish=()=>{if(finished||token!==resultLoadToken)return;finished=true;resultLoadTimers.forEach(clearTimeout);resultLoadTimers=[];renderResultContent();moveTop('result-heading');};
    photo.onload=finish;
    photo.onerror=()=>{
      if(finished||token!==resultLoadToken)return;
      resultLoadTimers.forEach(clearTimeout);resultLoadTimers=[];currentScreen='result-error';
      APP.innerHTML=`<section class="result-wait result-load-error" aria-labelledby="wait-title"><div class="wait-card"><h1 id="wait-title" tabindex="-1">照片暂时没赶到</h1><button type="button" class="secondary retry-photo" id="retry-result-photo">再接一次 →</button></div></section>`;
      document.getElementById('retry-result-photo').onclick=renderResult;moveTop('wait-title');
    };
    photo.src=PHOTOS[currentResult.person.id];
    if(photo.complete&&photo.naturalWidth){finish();return;}
    resultLoadTimers.push(setTimeout(()=>{
      if(finished||token!==resultLoadToken)return;
      APP.innerHTML=`<section class="result-wait" aria-labelledby="wait-title" aria-busy="true"><div class="wait-card"><div class="wait-envelope" aria-hidden="true"><svg viewBox="0 0 160 130" fill="none"><path d="M25 48 80 12l55 36v65H25V48Z" fill="#e9dfc5" stroke="#254e43" stroke-width="2"/><rect x="42" y="28" width="76" height="65" rx="4" fill="#fffdf7" stroke="#254e43" stroke-width="2"/><path d="M56 45h49M56 56h37M56 67h44" stroke="#b1bda5" stroke-width="2"/><path d="m25 48 55 39 55-39v65H25V48Z" fill="#e6ebe1" stroke="#254e43" stroke-width="2"/><path d="m25 113 43-35m67 35L92 78" stroke="#254e43" stroke-width="2"/><path d="m137 18 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#ac5338"/></svg></div><h1 id="wait-title" tabindex="-1" role="status">友情观察员，<br>正在翻笔记<span class="wait-dots" aria-hidden="true"><i></i><i></i><i></i></span></h1></div></section>`;
      moveTop('wait-title');
    },120));
  }
  function prepareResultPhoto(){
    const img=APP.querySelector('.result-portrait');if(!img)return;const button=img.closest('button');
    const ready=()=>{button.classList.remove('is-loading');button.disabled=false;button.removeAttribute('aria-busy');};
    if(img.complete&&img.naturalWidth){ready();return;}
    button.classList.add('is-loading');button.disabled=true;button.setAttribute('aria-busy','true');
    const failed=()=>{button.querySelector('.photo-status').textContent='照片暂时没赶上，先读读你的故事。';button.removeAttribute('aria-busy');};
    img.addEventListener('load',ready,{once:true});img.addEventListener('error',failed,{once:true});if(img.complete&&!img.naturalWidth)failed();
  }

  function renderResultContent(){
    cancelAdvance();
    currentResult=scoreAnswers(state.answers);currentScreen='result';const report=buildReport(currentResult,state.answers),p=report.person,secondary=report.secondary;
    APP.innerHTML=`<section class="screen result-screen"><div class="result-intro"><h1 id="result-heading" tabindex="-1">你的友情角色</h1></div><article class="result-card" aria-label="${p.name}型完整友情解析"><div class="card-header"><span>后会友期 · 友情档案</span><span>NO. ${String(PEOPLE.indexOf(p)+1).padStart(2,'0')}</span></div><div class="card-person">${showPhoto(p.id,p.name+'《后会友期》嘉宾海报','result-portrait')}<div class="card-identity"><p class="card-type">原来，你是这样的朋友</p><h2 class="card-name">${p.name}<small> 型</small></h2><p class="card-archetype">${p.type}</p><div class="card-tags">${p.tags.map(tag=>`<span>${tag}</span>`).join('')}</div></div></div><p class="card-quote">${p.quote}</p><div class="report-body">${report.sections.map((section,index)=>`<section class="report-section" data-report-section="${index}"><h3><span>${String(index+1).padStart(2,'0')}</span>${section.title}</h3>${section.paragraphs.map(paragraph=>`<p>${paragraph}</p>`).join('')}</section>`).join('')}<div class="say-note"><span>可以试着这样说</span><p>${report.say}</p></div>${secondary?`<section class="secondary-profile" aria-labelledby="secondary-title"><h3 id="secondary-title">你也有一点 ${secondary.person.name} 型的侧面</h3><p>${secondary.intro}</p><p>${secondary.detail}</p><p class="secondary-closing">${secondary.closing}</p></section>`:''}<section class="report-section"><h3>你的五个相处倾向</h3>${traitsHTML(report.values)}<p class="trait-caption">只是这次答题里显露的小倾向，没有哪一边更好。</p></section><div class="gentle-note"><span>寄给你的一句话</span><p>${report.note}</p></div><p class="reading-note">${report.readingNote}</p></div><div class="card-footer">${report.footer}</div></article><div class="result-actions"><button class="primary" id="save-card">保存结果海报 <span aria-hidden="true">↓</span></button><button class="secondary" id="copy-result">复制结果文案</button></div>${friendSectionHTML()}<div class="result-more"><button class="text-btn" id="review-button">回看并修改答案</button><button class="text-btn" id="restart-button">重新测试 ↻</button></div></section>`;
    prepareResultPhoto();
    APP.querySelectorAll('input[name="friend-role"]').forEach(input=>input.addEventListener('change',()=>{friendResultId=input.value;renderFriendAdvice();}));document.getElementById('clear-friend').onclick=()=>{friendResultId='';APP.querySelectorAll('input[name="friend-role"]').forEach(input=>input.checked=false);renderFriendAdvice();APP.querySelector('input[name="friend-role"]').focus({preventScroll:true});};renderFriendAdvice();
    document.getElementById('save-card').onclick=saveCard;document.getElementById('copy-result').onclick=copyResult;document.getElementById('restart-button').onclick=startFresh;document.getElementById('review-button').onclick=()=>{state.index=0;persist();renderQuestion();moveTop('question-title');};
  }

  function notify(message){clearTimeout(toastTimer);const node=document.getElementById('toast');node.textContent=message;node.hidden=false;toastTimer=setTimeout(()=>node.hidden=true,3200);}
  function openDialog(id){const dialog=document.getElementById(id);if(!dialog.open)dialog.showModal();}
  document.addEventListener('click',event=>{const photo=event.target.closest('[data-photo]');if(photo){document.getElementById('photo-title').textContent=photo.dataset.photoAlt;document.getElementById('photo-lightbox').src=PHOTOS[photo.dataset.photo];document.getElementById('photo-lightbox').alt=photo.dataset.photoAlt;openDialog('photo-dialog');}const open=event.target.closest('[data-open]');if(open)openDialog(open.dataset.open);if(event.target.closest('[data-close]'))event.target.closest('dialog').close();});
  document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}}));
  document.getElementById('home-button').onclick=()=>{persist();renderLanding();moveTop();};
  function shareText(){
    const report=buildReport(currentResult),p=report.person;
    let text=`测测你是《后会友期》里的谁？\n\n我测出了「${p.name}型 · ${p.type}」\n${p.quote}\n\n${p.tags.join(' · ')}\n\n`;
    text+=report.sections.map(section=>`【${section.title}】\n${section.paragraphs.join('\n')}`).join('\n\n');
    text+=`\n\n【可以试着这样说】\n${report.say}`;
    if(report.secondary)text+=`\n\n【另一种侧面】\n${report.secondary.intro}\n${report.secondary.detail}`;
    text+=`\n\n【寄给你的一句话】\n${report.note}`;
    const friend=PEOPLE.find(person=>person.id===friendResultId);
    if(friend){const pair=pairAdvice(p,friend);text+=`\n\n【我和朋友的相处方式】\n我：${p.name}型；朋友：${friend.name}型\n${pair.sections.map(section=>section.title+'：'+section.text).join('\n\n')}`;}
    text+='\n\n'+report.readingNote+'\n（非官方娱乐测试）';
    const host=location.hostname,local=/^(localhost|127\.|0\.|10\.|192\.168\.|\[?::1\]?$)/.test(host)||/^172\.(1[6-9]|2\d|3[01])\./.test(host);if(location.protocol==='https:'&&!local)text+='\n'+location.origin+location.pathname;return text;
  }
  async function copyResult(){if(!currentResult)return;const text=shareText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);notify('结果文案已复制。');return;}}catch{}const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0;';const parent=document.querySelector('dialog[open]')||document.body;parent.appendChild(area);area.select();let success=false;try{success=document.execCommand('copy');}catch{}area.remove();if(success){notify('结果文案已复制。');}else{document.getElementById('copy-text').value=text;openDialog('copy-dialog');document.getElementById('copy-text').select();}}
  document.getElementById('copy-in-dialog').onclick=copyResult;
  function textLines(ctx,text,width){
    const lines=[];let line='';
    for(const char of text){
      if(char==='\n'){lines.push(line);line='';continue;}
      if(line&&ctx.measureText(line+char).width>width){
        if((/[，。！？；：、”’）》】]/.test(char)||/[“‘（《【]$/.test(line))&&Array.from(line).length>1){const chars=Array.from(line);let tail=chars.pop();while(chars.length>1&&/^[，。！？；：、”’）》】]/.test(tail))tail=chars.pop()+tail;lines.push(chars.join(''));line=tail+char;}
        else{lines.push(line);line=char;}
      }else line+=char;
    }
    if(line)lines.push(line);return lines;
  }
  async function saveCard(){
    if(!currentResult)return;
    const button=document.getElementById('save-card');button.disabled=true;button.textContent='正在生成结果海报…';
    try{
      await document.fonts.ready;const report=buildReport(currentResult,state.answers),p=report.person;
      const photo=new Image();await new Promise((resolve,reject)=>{photo.onload=resolve;photo.onerror=reject;photo.src=PHOTOS[p.id];});
      const c=document.createElement('canvas');c.width=1080;const ctx=c.getContext('2d');if(!ctx)throw new Error('canvas');
      const font='"Microsoft YaHei", "PingFang SC", sans-serif';const ops=[];let y=900;
      function addText(text,x,top,width,size=32,lineHeight=53,color='#293c34',weight='400'){
        ctx.font=weight+' '+size+'px '+font;const lines=textLines(ctx,text,width);
        lines.forEach((line,index)=>ops.push({kind:'text',text:line,x,y:top+index*lineHeight,size,color,weight}));return top+lines.length*lineHeight;
      }
      function line(top){ops.push({kind:'line',y:top});}
      function heading(text){line(y);y+=35;y=addText(text,100,y,880,34,55,'#254e43','600');y+=12;}
      ctx.font='44px '+font;for(const row of p.quote.split('\n')){ops.push({kind:'text',text:row,x:540,y,size:44,color:'#293c34',weight:'400',align:'center'});y+=72;}y+=36;
      report.sections.forEach((section,index)=>{heading(String(index+1).padStart(2,'0')+'  '+section.title);section.paragraphs.forEach(paragraph=>{y=addText(paragraph,100,y,880,32,55);y+=18;});y+=25;});
      const sayStart=y;y+=25;y=addText('可以试着这样说',128,y,824,25,43,'#727c69');y=addText(report.say,128,y+8,824,33,56,'#254e43');y+=27;ops.unshift({kind:'box',x:100,y:sayStart,w:880,h:y-sayStart,color:'#e6ebe1'});y+=44;
      if(report.secondary){const start=y;y+=28;y=addText('你也有一点 '+report.secondary.person.name+' 型的侧面',122,y,836,32,52,'#254e43','600');y=addText(report.secondary.intro,122,y+12,836,29,49);y+=22;y=addText(report.secondary.detail,122,y,836,29,49);y+=22;y=addText(report.secondary.closing,122,y,836,27,46,'#657160');y+=24;ops.unshift({kind:'box',x:100,y:start,w:880,h:y-start,color:'#e6ebe1'});y+=40;}
      heading('你的五个相处倾向');
      AXES.forEach((axis,index)=>{const top=y;ops.push({kind:'trait',axis,value:report.values[index],y:top});y+=108;});
      y=addText('只是这次答题里显露的小倾向，没有哪一边更好。',100,y,880,25,42,'#727c69');y+=43;
      const noteStart=y;y+=26;y=addText('寄给你的一句话',128,y,824,25,43,'#727c69');y=addText(report.note,128,y+8,824,35,57,'#254e43');y+=26;ops.unshift({kind:'box',x:100,y:noteStart,w:880,h:y-noteStart,color:'#e6ebe1'});y+=35;
      y=addText(report.readingNote,100,y,880,24,41,'#727c69');y+=24;line(y);y=addText(report.footer,100,y+24,880,23,40,'#727c69');y+=55;
      c.height=Math.ceil(y);ctx.textBaseline='top';ctx.fillStyle='#f5f3eb';ctx.fillRect(0,0,1080,c.height);ctx.fillStyle='#fffdf7';ctx.fillRect(46,46,988,c.height-92);ctx.strokeStyle='#ccd4bf';ctx.lineWidth=2;ctx.strokeRect(46,46,988,c.height-92);
      ctx.fillStyle='#727c69';ctx.font='22px '+font;ctx.fillText('后会友期 · 友情档案',100,93);ctx.textAlign='right';ctx.fillText('NO. '+String(PEOPLE.indexOf(p)+1).padStart(2,'0'),980,93);ctx.textAlign='left';ctx.beginPath();ctx.moveTo(100,147);ctx.lineTo(980,147);ctx.stroke();
      const pw=374,ph=pw*photo.naturalHeight/photo.naturalWidth;ctx.drawImage(photo,606,196,pw,ph);
      ctx.fillStyle='#ac5338';ctx.font='27px '+font;ctx.fillText('原来，你是这样的朋友',100,235);ctx.fillStyle='#254e43';ctx.font='88px '+font;ctx.fillText(p.name+' 型',96,298);ctx.font='32px '+font;ctx.fillText(p.type,100,414);ctx.font='24px '+font;ctx.fillStyle='#727c69';p.tags.forEach((tag,index)=>ctx.fillText('— '+tag,100,510+index*47));
      for(const op of ops){
        if(op.kind==='box'){ctx.fillStyle=op.color;ctx.fillRect(op.x,op.y,op.w,op.h);}
        if(op.kind==='line'){ctx.strokeStyle='#d8ddcf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(100,op.y);ctx.lineTo(980,op.y);ctx.stroke();}
        if(op.kind==='text'){ctx.fillStyle=op.color;ctx.font=op.weight+' '+op.size+'px '+font;ctx.textAlign=op.align||'left';ctx.fillText(op.text,op.x,op.y);}
        if(op.kind==='trait'){ctx.font='24px '+font;ctx.fillStyle='#727c69';ctx.textAlign='left';ctx.fillText(op.axis.left,100,op.y);ctx.textAlign='center';ctx.fillStyle='#293c34';ctx.fillText(op.axis.name,540,op.y);ctx.textAlign='right';ctx.fillStyle='#727c69';ctx.fillText(op.axis.right,980,op.y);ctx.fillStyle='#dce2d3';ctx.fillRect(108,op.y+49,864,6);ctx.fillStyle='#aebba4';ctx.fillRect(539,op.y+44,2,16);ctx.fillStyle='#254e43';ctx.beginPath();ctx.arc(108+864*op.value,op.y+52,10,0,Math.PI*2);ctx.fill();}
      }
      const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw new Error('image');if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(blob);document.getElementById('share-preview').src=previewURL;document.getElementById('share-preview').alt=p.name+'型结果海报';const download=document.getElementById('download-card');download.href=previewURL;download.download='后会友期-'+p.name+'型-结果海报.png';openDialog('image-dialog');
    }catch{notify('长图生成暂时失败，可以先截图或复制结果文案。');}
    finally{button.disabled=false;button.innerHTML='保存结果海报 <span aria-hidden="true">↓</span>';}
  }

  window.addEventListener('pagehide',()=>{if(previewURL)URL.revokeObjectURL(previewURL);});
  renderLanding();
  </script>
